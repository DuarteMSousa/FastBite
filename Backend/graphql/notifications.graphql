type MarkNotificationReadPayload {
  ok: Boolean!
  notification_id: ID!
  read_at: String
}

type MarkAllNotificationsReadPayload {
  ok: Boolean!
  affected_count: Int!
}

input RegisterPushTokenInput {
  token: String!
  provider: PushTokenProvider = EXPO
  platform: String
}

enum PushTokenProvider {
  EXPO @enum(value: "expo")
}

type RegisterPushTokenPayload {
  ok: Boolean!
  push_token_id: ID!
  is_active: Boolean!
}

type UserNotificationPage {
  items: [UserNotification!]!
  current_page: Int!
  per_page: Int!
  total: Int!
  last_page: Int!
}

extend type Query {
  getNotificationsByUserId(user_id: ID!, unread_only: Boolean = false, page: Int = 1, per_page: Int = 50): UserNotificationPage!
    @field(resolver: "App\\GraphQL\\Queries\\NotificationQueries@getNotificationsByUserId")
}

extend type Mutation {
  markNotificationAsRead(user_id: ID!, notification_id: ID!): MarkNotificationReadPayload!
    @field(resolver: "App\\GraphQL\\Mutations\\NotificationMutations@markNotificationAsRead")

  markAllNotificationsAsRead(user_id: ID!): MarkAllNotificationsReadPayload!
    @field(resolver: "App\\GraphQL\\Mutations\\NotificationMutations@markAllNotificationsAsRead")

  registerPushToken(user_id: ID!, input: RegisterPushTokenInput!): RegisterPushTokenPayload!
    @field(resolver: "App\\GraphQL\\Mutations\\NotificationMutations@registerPushToken")
}
