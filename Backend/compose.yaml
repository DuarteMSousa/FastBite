services:
    laravel.test:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS -d xdebug.mode=off -d xdebug.start_with_request=no /var/www/html/artisan serve --host=0.0.0.0 --port=80'
            RUN_COMPOSER_INSTALL: 'true'
            RUN_MIGRATIONS: 'true'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD:-}'
        volumes:
            - './app:/var/www/html/app'
            - './config:/var/www/html/config'
            - './routes:/var/www/html/routes'
            - './graphql:/var/www/html/graphql'
            - './database:/var/www/html/database'
            - './resources:/var/www/html/resources'
            - './storage:/var/www/html/storage'
            - './gateway:/var/www/html/gateway'
            - './.env:/var/www/html/.env'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - test
                - '-f'
                - /tmp/laravel-ready
            retries: 10
            timeout: 5s
            interval: 5s
            start_period: 5s

    queue:
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS -d xdebug.mode=off -d xdebug.start_with_request=no /var/www/html/artisan queue:work --tries=3 --timeout=90'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        volumes:
            - './app:/var/www/html/app'
            - './config:/var/www/html/config'
            - './routes:/var/www/html/routes'
            - './graphql:/var/www/html/graphql'
            - './database:/var/www/html/database'
            - './resources:/var/www/html/resources'
            - './storage:/var/www/html/storage'
            - './gateway:/var/www/html/gateway'
            - './.env:/var/www/html/.env'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_healthy
            pgsql:
                condition: service_healthy

    gateway:
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${GATEWAY_WORKER_WEBSOCKET_PORT:-8090}:${GATEWAY_WORKER_WEBSOCKET_PORT:-8090}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS -d xdebug.mode=off -d xdebug.start_with_request=no /var/www/html/gateway/start.php start'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        volumes:
            - './app:/var/www/html/app'
            - './config:/var/www/html/config'
            - './routes:/var/www/html/routes'
            - './graphql:/var/www/html/graphql'
            - './database:/var/www/html/database'
            - './resources:/var/www/html/resources'
            - './storage:/var/www/html/storage'
            - './gateway:/var/www/html/gateway'
            - './.env:/var/www/html/.env'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_healthy
            pgsql:
                condition: service_healthy
            
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 10
            timeout: 5s
            interval: 5s
            start_period: 10s

    pgadmin:
        image: 'dpage/pgadmin4'
        ports:
            - '${FORWARD_PGADMIN_PORT:-5050}:80'
        environment:
            PGADMIN_DEFAULT_EMAIL: '${PGADMIN_DEFAULT_EMAIL:-pgadmin@example.com}'
            PGADMIN_DEFAULT_PASSWORD: '${PGADMIN_DEFAULT_PASSWORD:-password}'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy

networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
