extend type Query {
  getPaymentByOrderId(order_id: ID!): Payment
    @field(resolver: "App\\GraphQL\\Queries\\PaymentQueries@getPaymentByOrderId")
}

extend type Mutation {
  confirmPayment(payment_id: ID!, transaction_id: String): Payment!
    @field(resolver: "App\\GraphQL\\Mutations\\PaymentMutations@confirmPayment")
}
